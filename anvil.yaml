    <noscript><div class="seo-noscript">
    <h1>Little Hero Books: picture books starring your child</h1>
    <p>Design a cartoon look-alike of your child, then read, colour, paint or print classic fairy tales starring them. Twelve tales retold for ages 3 to 6.</p>
    <p>Little Hero Books makes personalised picture books. A parent designs a cartoon look-alike of their child (ages 1 to 12; face, skin tone, hair, eyes, clothes, hats and head coverings, glasses, name and pronouns), then picks from twelve public-domain fairy tales retold short for ages 3 to 6.</p>
    <p>Every illustration has a space where the child goes, and the app draws the child into it. The finished 12-page book can be read on screen with page turns and Read to me, coloured in with on-screen crayons, or downloaded as an 8 x 8 inch PDF, a print-ready PDF with bleed for photo-book printers, or a colour-me-in book.</p>
    <p>Parents can record their own voice reading each page, share a family link so grandparents can read along, and have the whole book repainted in one of six art styles, from watercolour to clay, while the child keeps the look they designed.</p>
    <p>Who it's for: Parents and grandparents of children aged about 3 to 6</p>
    <h2>What it does</h2><ul><li>A hero studio for ages 1 to 12 with 20 skin tones, 30 hairstyles and 20 outfits</li><li>Head coverings including hijab, patka and kippah</li><li>Twelve classic fairy tales retold for ages 3 to 6, with your child drawn into every picture</li><li>Read on screen with Read to me, or record your own voice page by page</li><li>Colour me in: every picture becomes an outline to colour with on-screen crayons</li><li>Paint this book: repaint every picture in one of six art styles</li><li>Download an 8 x 8 inch PDF, a print-ready PDF with bleed, or a colour-me-in book</li><li>Family links so grandparents can read the book too</li></ul>
    <h2>Questions</h2><h3>Which stories are included?</h3><p>Twelve public-domain fairy tales, such as The Three Bears, Jack and the Beanstalk, The Gingerbread Man and The Ugly Duckling, retold in 300 to 500 words for children aged 3 to 6.</p><h3>Can I print the book?</h3><p>Yes. Download an 8 x 8 inch PDF for a home printer, a print-ready PDF with bleed for photo-book printers (8 x 8 in, 8.5 x 8.5 in or 20 x 20 cm), or a colour-me-in book.</p><h3>Do I upload a photo of my child?</h3><p>No. You design a cartoon look-alike by choosing features; no photo is needed.</p><h3>Can the pictures look painted?</h3><p>Yes. Paint this book repaints every picture in one of six styles (Storybook, Watercolour, 3D cartoon, Clay, Comic book, Fairy-tale painting), keeping the look you designed.</p>
    <p><a href="https://littleheroapp.com/about">About Little Hero Books</a> &middot; <a href="https://littleheroapp.com/llms.txt">Little Hero Books for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. Little Hero Books needs JavaScript in your browser.</p>
    </div></noscript>
    <!-- seo:end -->
