<anvil-form layout="Little_Hero_Books.Layouts.Shell" prop:active="">
  <anvil-block slot="content">
    <div class="ui-wrap bk-wrap" anvil:name="found">
      <div class="bk-head">
        <div>
          <anvil-component type="Label" name="eyebrow" prop:role='["eyebrow-label"]'></anvil-component>
          <anvil-component type="Label" name="title" prop:role='["bk-title"]'></anvil-component>
          <anvil-component type="Label" name="intro" prop:role='["bk-intro"]'></anvil-component>
        </div>
      </div>
      <anvil-component type="Little_Hero_Books.Components.Reader" name="reader">
        <anvil-component type="Button" name="pdf_button" prop:text="Download PDF" prop:role='["btn", "btn-sm", "btn-primary", "ic-download"]' container:dropzone="tools"></anvil-component>
      </anvil-component>
      <anvil-component type="Little_Hero_Books.Components.MakeYours" name="cta"></anvil-component>
    </div>
    <div class="ui-wrap ui-narrow" anvil:name="broken">
      <div class="ui-empty">
        <i class="ic ic-link"></i>
        <h3>This family link doesn’t work</h3>
        <anvil-component type="Label" name="broken_text"></anvil-component>
        <a class="ui-btn primary" href="#landing">See Little Hero Books</a>
      </div>
    </div>
  </anvil-block>
</anvil-form>
