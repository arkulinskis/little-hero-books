<div class="ui lhp-dialog">
  <h2 class="dlg-h">Download a PDF</h2>
  <div class="ui-stack">
    <div class="lhp-label">Which book?</div>
    <div class="lhp-cards">
      <button type="button" class="lhp-card" anvil:name="kind_colour" data-k="colour" anvil:on-dom:click="self.kind_click">
        <anvil-component type="Little_Hero_Books.Components.Cover" name="cover_colour"></anvil-component>
        <b>Picture book</b><small>Full colour, just like on screen</small>
      </button>
      <button type="button" class="lhp-card" anvil:name="kind_outline" data-k="outline" anvil:on-dom:click="self.kind_click">
        <anvil-component type="Little_Hero_Books.Components.Cover" name="cover_outline" prop:outline="true"></anvil-component>
        <b>Colour-me-in book</b><small>Outlines for crayons, plus a page to draw on</small>
      </button>
    </div>
    <button type="button" class="lhp-row" anvil:name="painted_row" anvil:on-dom:click="self.painted_click">
      <i class="ic ic-palette"></i><span><b>Use the painted pictures</b><small>The pictures from the painting studio instead of the drawings.</small></span>
    </button>
    <div class="lhp-label">Where will you print it?</div>
    <div class="lhp-list">
      <button type="button" class="lhp-row" anvil:name="use_home" data-u="home" anvil:on-dom:click="self.use_click">
        <i class="ic ic-print"></i><span><b>Screen or home printer</b><small>8 × 8 in pages that fit on Letter or A4 paper. A smaller file.</small></span>
      </button>
      <button type="button" class="lhp-row" anvil:name="use_print" data-u="print" anvil:on-dom:click="self.use_click">
        <i class="ic ic-book"></i><span><b>Photo-book printer</b><small>Print-ready: 300 dpi pages with the extra bleed edge that printers trim off.</small></span>
      </button>
    </div>
    <div class="lhp-print" anvil:name="print_part">
      <label>Book size<anvil-component type="DropDown" name="size_box"></anvil-component></label>
      <label>Bleed<anvil-component type="DropDown" name="bleed_box"></anvil-component></label>
      <anvil-component type="Label" name="note" prop:role='["fine-print", "lhp-note"]'></anvil-component>
    </div>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="make_button" prop:text="Make my PDF" prop:role='["btn", "btn-primary", "ic-download"]'></anvil-component>
    </div>
  </div>
</div>
